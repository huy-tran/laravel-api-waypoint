providers:
  - Hygo\ApiWaypoint\ApiWaypointServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

env:
  - APP_NAME="Acme Orders API"
  - APP_URL="http://acme-orders.test"
  - API_WAYPOINT_ENABLED=true
  - API_WAYPOINT_SECRET=workbench-secret
  - DB_CONNECTION=testing
  - CACHE_STORE=array
  - SESSION_DRIVER=array
  - QUEUE_CONNECTION=sync
