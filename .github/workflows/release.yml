name: release

# A release can be started two ways, and both run the same checks.
#
#   workflow_dispatch  You give a version; the workflow verifies it, runs every
#                      check, and only then creates the tag. Checks gate the tag.
#                      Requires admin rights on the repository.
#
#   push of a v* tag   You create the tag; the workflow verifies it, runs every
#                      check, and publishes the release. Needs only push access,
#                      which is what most maintainers actually have.
#
# The dispatch path is preferable when it is available, because the tag cannot
# come into existence unless the checks pass first. On the tag path the tag is
# already public by the time the checks run, so a failure means deleting it.
#
# Composer packages take their version from the git tag, not from a version field
# in composer.json: `composer validate --strict` warns when that field is present
# on a package published to Packagist. So CHANGELOG.md is the source of truth in
# the repository, and this workflow turns it into the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true
        type: string
      dry-run:
        description: 'Run every check but do not tag or publish'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the tag lands on a commit with real ancestry and the
          # release-notes step can see the whole CHANGELOG.
          fetch-depth: 0

      - name: Work out what is being released
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=tag
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            MODE=dispatch
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          fi

          # Semver, optionally with a prerelease. On the dispatch path this also
          # rejects a leading v, so the tag name is formed in exactly one place.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::[$VERSION] is not a semver version. Use 1.2.3 (tag v1.2.3)."
            exit 1
          fi

          {
            echo "mode=$MODE"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $TAG via the $MODE path."

      - name: Check the commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${{ steps.version.outputs.mode }}" = "dispatch" ]; then
            # A dispatch runs against a ref directly, so just check which one.
            if [ "${{ github.ref_name }}" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Releases are cut from $DEFAULT_BRANCH, not ${{ github.ref_name }}."
              exit 1
            fi
            exit 0
          fi

          # A tag can point anywhere. Refuse to release one cut from a commit that
          # never reached the default branch.
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::${{ steps.version.outputs.tag }} points at a commit that is not on $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Refuse to reuse an existing tag
        if: ${{ steps.version.outputs.mode == 'dispatch' }}
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump the version."
            exit 1
          fi

      - name: Extract the release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Move the Unreleased entries into one and commit that first."
            exit 1
          fi

          # Everything between this version's heading and the next one. Matched
          # with index() rather than a regex: a version built into a dynamic awk
          # pattern turns "[0.1.0]" into a character class and silently matches
          # nothing.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::The '## [$VERSION]' section in CHANGELOG.md is empty."
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, fileinfo, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      # Catches the things that only bite once the package is public: a malformed
      # composer.json, a stray version field, missing metadata.
      - name: Validate composer.json
        run: composer validate --strict

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      # Includes the golden-file and contract-conformance tests, so a release
      # cannot ship a document that no longer matches the published meta-schema.
      - name: Run tests
        run: vendor/bin/pest --ci

      - name: Confirm the package installs from a clean tree
        # Proves the runtime requires are sufficient on their own: a dependency
        # that only lives in require-dev shows up here as an autoload failure.
        #
        # --no-scripts because this repository's post-autoload-dump runs Testbench,
        # which is a dev dependency and absent by definition. Composer only runs the
        # root package's scripts, so a consumer never executes them either; running
        # them here would test the development tooling rather than the package.
        run: |
          rm -rf vendor composer.lock
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress
          php -r 'require "vendor/autoload.php"; new ReflectionClass(Hygo\ApiWaypoint\ApiWaypointServiceProvider::class); echo "autoloads without dev dependencies\n";'

      - name: Stop here on a dry run
        if: ${{ inputs.dry-run }}
        run: |
          echo "::notice::Dry run: every check passed. ${{ steps.version.outputs.tag }} was not created."
          exit 0

      - name: Create and push the tag
        if: ${{ steps.version.outputs.mode == 'dispatch' && ! inputs.dry-run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish the GitHub Release
        if: ${{ ! inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Summarise
        if: ${{ ! inputs.dry-run }}
        run: |
          {
            echo "### Released ${{ steps.version.outputs.tag }}"
            echo
            echo "Started via the **${{ steps.version.outputs.mode }}** path."
            echo
            echo "Packagist updates from the tag within a minute or so, provided the"
            echo "GitHub integration is connected. Check:"
            echo "<https://packagist.org/packages/hygo/laravel-api-waypoint>"
          } >> "$GITHUB_STEP_SUMMARY"
